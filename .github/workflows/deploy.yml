name: CDK Deploy

on:
  push:
    branches: [main, dev, 'feature/**']

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Install CDK CLI
        run: npm install -g aws-cdk
      
      - name: Install Python Dependancies
        run: pip install -r requirements.txt
      
      - name: Install Lambda Dependancies
        run: |
          pip install -r lambda/requirements.txt -t lambda/ \
            --platform manylinux2014_x86_64 \
            --python-version 3.13 \
            --implementation cp \
            --only-binary=:all:

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::REDACTED_ACCOUNT_ID:role/CdkDeployRole
          aws-region: eu-west-2
      
      - name: Synth
        run: cdk synth

      - name: Deploy Feature Branch
        if: github.ref == 'refs/heads/feature/*'
        run: cdk deploy FBStack --require-approval never
      
      - name: Deploy Dev
        if: github.ref == 'refs/heads/dev'
        run: cdk deploy DevStack --require-approval never

      - name: Deploy Prod
        if: github.ref == 'refs/heads/main'
        run: cdk deploy ProdStack --require-approval never