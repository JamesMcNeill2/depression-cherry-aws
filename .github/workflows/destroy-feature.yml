name: CDK Destroy Feature Branch

on:
  delete:

permissions:
  id-token: write
  contents: read

jobs:
  destroy:
    if: github.event.ref_type == 'branch' && startsWith(github.event.ref, 'feature/')
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        ref: main
    
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '22'
      
    - name: Set Branch Name
      run: echo "BRANCH_NAME=${{ github.event.ref }}" >> "$GITHUB_ENV"
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        cache: 'pip'
    
    - name: Install CDK CLI
      run: npm install -g aws-cdk
    
    - name: Install Python Dependencies
      run: pip install -r requirements.txt
    
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/CdkDeployRole
        aws-region: eu-west-2
    
    - name: Get Stack Name
      run: |
        STACK_NAME=$(cdk list --no-notices | tail -n 1)
        if [ -z "$STACK_NAME" ]; then
          echo "::error::Could not resolve stack name"
          exit 1
        fi
        case "$STACK_NAME" in
          *-prod|*-dev)
            echo "::error::Refusing to destroy $STACK_NAME"
            exit 1
            ;;
        esac
        echo "STACK_NAME=$STACK_NAME" >> "$GITHUB_ENV"
        echo "Resolved stack: $STACK_NAME"
    
    - name: Destroy
      run: cdk destroy "$STACK_NAME" --force

    - name: Verify Stack Is Gone
      run: |
        if aws cloudformation describe-stacks --stack-name "$STACK_NAME" >/dev/null 2>&1; then
          echo "::error::$STACK_NAME still exists after destroy"
          exit 1
        fi
        echo "$STACK_NAME destroyed"